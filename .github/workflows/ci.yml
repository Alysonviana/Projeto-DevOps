name: CI/CD — Biblioteca

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Testes Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Rodar testes
        working-directory: backend
        run: npm test

  build-backend:
    name: Build Docker — Backend
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem backend
        run: docker build -t biblioteca-backend ./backend

  build-frontend:
    name: Build Docker — Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar HTML
        run: |
          if grep -q "<!DOCTYPE html>" frontend/src/index.html; then
            echo "✅ HTML válido"
          else
            echo "❌ index.html inválido"
            exit 1
          fi

      - name: Build imagem frontend
        run: docker build -t biblioteca-frontend ./frontend

  compose-up:
    name: Subir com Docker Compose
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Criar .env
        run: cp .env.example .env

      - name: Docker Compose up
        run: docker compose up -d --build

      - name: Aguardar backend
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/livros > /dev/null; then
              echo "✅ Backend OK"
              exit 0
            fi
            echo "Aguardando... ($i)"
            sleep 3
          done
          docker compose logs backend
          exit 1

      - name: Verificar frontend
        run: curl -sf http://localhost:80 > /dev/null && echo "✅ Frontend OK"

      - name: Docker Compose down
        if: always()
        run: docker compose down -v